summary: >-
  Convex publishes no conformance or certification claim of any kind. As a London
  company-market specialty carrier it is prudentially regulated (PRA-authorised,
  FCA/PRA-regulated) and almost certainly exchanges ACORD-standard messaging through
  market placing platforms and broker connectivity, but none of that is stated publicly,
  so it is recorded as "not published" rather than as conformance. The API surface is
  entirely partner-gated, so no security-scheme, error-format or pagination convention
  is observable. No Compliance pointer is wired because no certification or compliance
  programme page is published.
