apis:
- name: Convex Digital Underwriting API
  description: >-
    The partner-gated REST API surface behind Convex Digital Underwriting. Convex
    publicly describes building "a suite of insurance specific APIs" that let broker
    and client platforms connect to Convex products for automated quote and bind on
    high-volume, low-complexity specialty business, either through a Convex-hosted
    portal or by wiring Convex products into an existing broker or client portal via
    API. The api.convexin.com host is confirmed live but answers every anonymous
    request with an application/json HTTP 401 {"message":"Unauthorized"} body — including
    every OpenAPI/Swagger, /graphql and /.well-known discovery path — with no
    WWW-Authenticate challenge, so the auth scheme, paths, versioning and payload shapes
    are not observable from outside. There is no developer portal, no API reference, no
    machine-readable definition, no sandbox and no self-serve signup; access is arranged
    commercially through the Convex Digital Trading / Business Development team.
