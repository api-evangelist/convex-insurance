name: Convex
kind: company
description: >-
  Convex Group Limited is an international specialty insurer and reinsurer founded
  in 2019 by Stephen Catlin and Paul Brand, headquartered in London with operations
  in Bermuda, Luxembourg, Guernsey and the United States. Convex writes complex
  commercial and specialty risk across property, casualty, marine, energy, aviation,
  cyber, political risk and credit, crisis management, accident and health, and
  equine/livestock/aquaculture, and writes property, casualty and specialty treaty
  reinsurance through Convex Re Limited in Bermuda and London. Convex Insurance UK
  Limited is authorised by the Prudential Regulation Authority and regulated by the
  FCA and PRA; it is a London company-market carrier rather than a Lloyd's syndicate,
  and it reported roughly $5.2bn of gross written premium in 2024. Convex operates a
  named Digital Underwriting function that publicly describes building "a suite of
  insurance specific APIs" for automated quote and bind on high-volume, low-complexity
  specialty books, delivered either through a Convex-hosted broker portal or by
  connecting Convex products into a broker's or client's existing portal via API.
  That API programme is real but entirely partner-gated: as of 2026-07-25 Convex
  publishes no public developer portal, no API reference, no OpenAPI or other machine-
  readable definition, no sandbox and no self-serve signup. The api.convexin.com host
  is live but answers every anonymous request with HTTP 401 Unauthorized, the
  digital.convexin.com broker application is an authenticated Unqork-hosted portal,
  and the Convex Quick Quote event-insurance surface is behind a broker account
  registration form. Integration is arranged through the Business Development team,
  not through documentation. No ACORD, AL3, NGDS or IVANS reference appears anywhere
  on Convex's public web presence.
